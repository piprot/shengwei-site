# Deploy to Cloudflare Pages (auto on every push to main)
name: Deploy to Cloudflare Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Create Pages project (ok if exists)
        run: npx --yes wrangler@latest pages project create shengwei-site --production-branch=main || true
      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@latest pages deploy . --project-name=shengwei-site --branch=main
